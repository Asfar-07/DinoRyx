spring.application.name = gym-management
server.port = 8080

client.server = ${CLIENT_SERVER_PATH}
client.cors.allowed-origins = ${CLIENT_SERVER_PATH}

google.client.id = ${GOOGLE_OAUTH_CLIENT_ID}
secret.key.jwt = ${JWT_SECRET_KEY}
secret.key.google.captcha.server = ${GOOGLE_CAPTCHA_SECRET_KEY}

spring.datasource.username = ${DATABASE_NAME}
spring.datasource.url = ${DATABASE_URL}
spring.datasource.password = ${DATABASE_PASSWORD}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl = true
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.format_sql = true;

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_MAIL_USERNAME}
spring.mail.password=${SUPPORT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

upload.path=uploads/avatars/
